<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>高大特區 22 案 · 房產分析儀表板</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#EFEDE8;
  --surface:#FFFFFF;
  --surface2:#F5F2EC;
  --surface3:#EAE6DF;
  --border:#D8D3CA;
  --border-dark:#1C1917;
  --text:#1C1917;
  --dim:#57534E;
  --mute:#A8A29E;
  --red:#C4230F;
  --red-bg:#FEF2EF;
  --red-border:#FBBDAF;
  --green:#166534;
  --green-bg:#F0FDF4;
  --green-border:#BBF7D0;
  --amber:#92400E;
  --amber-bg:#FFFBEB;
  --amber-border:#FDE68A;
  --blue:#1E3A8A;
  --sans:'IBM Plex Sans','Noto Sans TC',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:2px solid var(--border-dark);padding:20px 28px}
.header-inner{max-width:1560px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.brand h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-size:13px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
.header-stats{display:flex;gap:28px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column;gap:3px}
.hstat-l{font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.hstat-v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em}

/* ── KPI ── */
.kpi-wrap{background:var(--surface);border-bottom:1px solid var(--border)}
.kpi-row{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.kpi-cell{padding:16px 20px;border-right:1px solid var(--border)}
.kpi-cell:last-child{border-right:none}
.kpi-cell .kl{font-size:11px;color:var(--mute);letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
.kpi-cell .kv{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi-cell .ks{font-size:12px;color:var(--dim);margin-top:2px}
.kpi-cell .kv.red{color:var(--red)}
.kpi-cell .kv.green{color:var(--green)}

/* ── TOOLBAR ── */
.toolbar{max-width:1560px;margin:0 auto;padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vbtn{padding:9px 20px;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.06em;border:1.5px solid var(--border-dark);cursor:pointer;background:transparent;color:var(--dim);transition:all .12s}
.vbtn.active,.vbtn:hover{background:var(--border-dark);color:#fff}
.search-inp{flex:1;min-width:220px;padding:9px 14px;border:1.5px solid var(--border);background:var(--surface);font:16px var(--sans);color:var(--text);outline:none}
.search-inp:focus{border-color:var(--border-dark)}
select.fil{padding:9px 12px;border:1.5px solid var(--border);background:var(--surface);font:15px var(--sans);color:var(--text);cursor:pointer;outline:none}
select.fil:focus{border-color:var(--border-dark)}


.tbl-ct{font-family:var(--mono);font-size:13px;color:var(--mute)}





/* ── MAIN CONTAINER ── */
.main{max-width:1560px;margin:0 auto;padding:20px 28px 60px}

/* ── MAP ── */
#mapView{display:none;margin-bottom:20px;border:1px solid var(--border);background:var(--surface)}
.map-head{padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.map-head h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.map-head .mleg{font-size:12px;color:var(--dim);font-family:var(--mono)}
#theMap{height:600px}
.leaflet-container{background:#EDE8DE!important;font-family:var(--sans)!important}
.leaflet-control-attribution{background:rgba(255,255,255,.85)!important;font-size:10px!important}
.leaflet-popup-content-wrapper{background:var(--surface);border:1.5px solid var(--border-dark);border-radius:0;padding:0;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.leaflet-popup-content{margin:0;padding:0;width:230px!important}
.leaflet-popup-tip{background:var(--border-dark)}
.mpopup{padding:14px 16px}
.mpopup-tag{font-size:11px;font-family:var(--mono);letter-spacing:.1em;font-weight:700;margin-bottom:5px}
.mpopup h3{font-size:15px;font-weight:600;margin-bottom:4px}
.mpopup .mprice{font-family:var(--mono);font-size:22px;font-weight:600;margin-bottom:3px}
.mpopup .mdelta{font-family:var(--mono);font-size:12px;margin-bottom:8px}
.mpopup .mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--border)}
.mpopup .mrow span:last-child{color:var(--text);font-weight:500}
.mpopup .dbtn{display:block;width:100%;text-align:center;background:var(--border-dark);color:#fff;border:none;padding:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;font-family:var(--mono);letter-spacing:.06em}
.mpopup .dbtn:hover{background:var(--amber)}

/* MAP PILLS */
.mpill{display:inline-flex;flex-direction:column;align-items:center;padding:4px 10px;font-family:var(--mono);cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:transform .12s,box-shadow .12s;border-radius:3px;min-width:72px}
.mpill:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,.28);z-index:9999}
.mpill .pn{font-size:12px;font-weight:700;line-height:1.3}
.mpill .pp{font-size:11px;opacity:.88;line-height:1.3}
.mpill.premium{background:var(--red);color:#fff}
.mpill.normal{background:var(--border-dark);color:#fff}
.mpill.discount{background:var(--green);color:#fff}
.mpill.presale{background:#fff;color:var(--text);border:1.5px dashed var(--border-dark)}
.mpill.presale .pn,.mpill.presale .pp{color:var(--text)}
.mpill.warn{background:var(--amber);color:#fff}

/* ── CARD GRID ── */
#listView{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.case-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);cursor:pointer;transition:box-shadow .15s,border-left-color .15s;display:flex;flex-direction:column}
.case-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
.case-card.premium{border-left-color:var(--red)}
.case-card.normal{border-left-color:var(--border-dark)}
.case-card.discount{border-left-color:var(--green)}
.case-card.warn{border-left-color:var(--amber)}

/* card header */
.cc-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.cc-name{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.cc-price{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.cc-price.red{color:var(--red)}
.cc-price.green{color:var(--green)}
.cc-price.amber{color:var(--amber)}
.cc-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.cc-dev{font-size:13px;color:var(--dim)}
.status-pill{font-size:11px;font-family:var(--mono);font-weight:700;padding:2px 8px;letter-spacing:.05em}
.sp-pre{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.sp-new{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sp-done{background:#EFF6FF;color:var(--blue);border:1px solid #BFDBFE}

/* sold bar */
.cc-sold{padding:10px 16px;border-bottom:1px solid var(--border)}
.sold-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.sold-l{font-size:12px;color:var(--dim)}
.sold-pct{font-family:var(--mono);font-size:14px;font-weight:600}
.sold-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.sold-fill{height:100%;border-radius:3px;transition:width .4s}
.sold-fill.red{background:var(--red)}
.sold-fill.green{background:var(--green)}
.sold-fill.amber{background:var(--amber)}
.sold-fill.gray{background:var(--mute)}

/* card body: chips */
.cc-chips{padding:10px 16px;display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border:1px solid var(--border);color:var(--dim);background:var(--surface2);border-radius:2px}
.chip.k{color:var(--amber);border-color:var(--amber-border);background:var(--amber-bg)}
.chip.b{color:var(--blue);border-color:#BFDBFE;background:#EFF6FF}

/* card footer: vs bar */
.cc-foot{padding:10px 16px;background:var(--surface2);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.vs-track{flex:1;height:4px;background:var(--surface3);position:relative;border-radius:2px}
.vs-center{position:absolute;left:50%;top:-4px;width:1.5px;height:12px;background:var(--border)}
.vs-fill{height:100%;border-radius:2px}
.vs-pos{background:var(--red);margin-left:50%}
.vs-neg{background:var(--green);float:right;margin-right:50%}
.vs-pct{font-family:var(--mono);font-size:14px;font-weight:600;min-width:60px;text-align:right}
.vs-pct.up{color:var(--red)}
.vs-pct.dn{color:var(--green)}
.tag-badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border:1px solid currentColor;letter-spacing:.04em}
.tb-red{color:var(--red);background:var(--red-bg)}
.tb-green{color:var(--green);background:var(--green-bg)}
.tb-amber{color:var(--amber);background:var(--amber-bg)}


/* ── FLOOR PLAN GALLERY ── */
.fp-section{margin-top:14px}
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.fp-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer;border:1px solid var(--border);transition:opacity .12s}
.fp-thumb:hover{opacity:.85}
.fp-thumb.error{background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.fp-count{font-size:12px;color:var(--dim);font-family:var(--mono)}
/* lightbox */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;align-items:center;justify-content:center;flex-direction:column}
.lb-overlay.on{display:flex}
.lb-img{max-width:90vw;max-height:85vh;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lb-close{position:fixed;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none;line-height:1;opacity:.8}
.lb-close:hover{opacity:1}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);color:#fff;font-size:36px;cursor:pointer;background:rgba(0,0,0,.3);border:none;padding:12px 16px;line-height:1;opacity:.7}
.lb-nav:hover{opacity:1}
.lb-prev{left:8px}
.lb-next{right:8px}
.lb-counter{position:fixed;bottom:16px;color:rgba(255,255,255,.7);font-family:var(--mono);font-size:13px}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(28,25,23,.55);backdrop-filter:blur(3px);z-index:9000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:2px solid var(--border-dark);width:100%;max-width:860px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal-hd{position:sticky;top:0;background:var(--surface2);border-bottom:2px solid var(--border-dark);padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.modal-hd h2{font-size:22px;font-weight:600;margin-top:4px}
.modal-hd .mdev{font-size:13px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.modal-hd button{background:none;border:1.5px solid var(--border);color:var(--dim);width:34px;height:34px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-hd button:hover{border-color:var(--border-dark);color:var(--text)}
.modal-bd{padding:22px 24px}
.price-hero{display:flex;align-items:baseline;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ph-num{font-family:var(--mono);font-size:46px;font-weight:600;line-height:1}
.ph-unit{font-size:15px;color:var(--dim);font-family:var(--mono)}
.msec-title{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.info-cell{background:var(--surface);padding:12px 16px}
.info-cell.full{grid-column:1/-1}
.ic-label{font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-family:var(--mono)}
.ic-val{font-size:15px;color:var(--text);font-weight:500}
.mat-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.notes-box{background:var(--amber-bg);border-left:3px solid var(--amber);padding:12px 16px;font-size:14px;color:var(--dim);line-height:1.7;margin-top:14px}
.analysis-box{background:#EFF6FF;border-left:3px solid var(--blue);padding:12px 16px;font-size:15px;line-height:1.7;margin-top:12px}
.analysis-box .al{font-size:11px;font-family:var(--mono);color:var(--blue);letter-spacing:.12em;font-weight:700;margin-bottom:5px;display:block}
.link-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.link-btn{font-family:var(--mono);font-size:13px;letter-spacing:.06em;padding:9px 16px;text-decoration:none;border:1.5px solid var(--border-dark);color:var(--text);transition:all .12s}
.link-btn:hover{background:var(--border-dark);color:#fff}

/* sold in modal */
.modal-sold{padding:14px 24px;background:var(--surface2);border-bottom:1px solid var(--border)}
.ms-row{display:flex;align-items:center;gap:14px}
.ms-bar{flex:1;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.ms-fill{height:100%;border-radius:4px}
.ms-pct{font-family:var(--mono);font-size:15px;font-weight:600;min-width:52px;text-align:right}
.ms-detail{font-size:13px;color:var(--dim);margin-top:4px;font-family:var(--mono)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:14px;margin-top:8px}
.donut-legend{display:flex;flex-direction:column;gap:4px}
.dl-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.dl-dot{width:10px;height:10px;border-radius:50%}

/* toast */
#toast{display:none;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--border-dark);color:#fff;font-family:var(--mono);font-size:14px;padding:12px 24px;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,.3);pointer-events:none}

@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .kpi-cell:nth-child(3){border-right:none}
  #listView{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .modal{max-width:100%}
}
@media(max-width:640px){
  .header{padding:14px 16px}
  .main{padding:14px 16px 40px}
  .toolbar{padding:10px 16px}
  .header-stats{gap:16px}
  .hstat-v{font-size:17px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <h1>高大特區 22 案 · 房產分析儀表板</h1>
      <div class="sub">樂居實登 113.01–115.03 · V16 · 2026.05.16</div>
    </div>
    <div class="header-stats">
      <div class="hstat"><span class="hstat-l">案數</span><span class="hstat-v">22</span></div>
      <div class="hstat"><span class="hstat-l">區域基準</span><span class="hstat-v">36.42<span style="font-size:13px;color:var(--dim)"> 萬/坪</span></span></div>
      <div class="hstat"><span class="hstat-l">最高均價</span><span class="hstat-v" style="color:var(--red)">50.20</span></div>
      <div class="hstat"><span class="hstat-l">最低均價</span><span class="hstat-v" style="color:var(--green)">28.99</span></div>
    </div>
  </div>
</div>

<div class="kpi-wrap">
  <div class="kpi-row">
    <div class="kpi-cell"><div class="kl">溢價門檻 +10%</div><div class="kv red">40.06</div><div class="ks">≥ 此為紅標</div></div>
    <div class="kpi-cell"><div class="kl">折價門檻 −5%</div><div class="kv green">34.60</div><div class="ks">≤ 此為綠標</div></div>
    <div class="kpi-cell"><div class="kl">累計成交筆數</div><div class="kv">1,648</div><div class="ks">22 案合計</div></div>
    <div class="kpi-cell"><div class="kl">最高售出率</div><div class="kv green">98%</div><div class="ks">遠見峰悅 310/318</div></div>
    <div class="kpi-cell"><div class="kl">最低售出率</div><div class="kv red">2%</div><div class="ks">冠傑Ai 5/231</div></div>
    <div class="kpi-cell"><div class="kl">資料更新</div><div class="kv" style="font-size:18px">115.03</div><div class="ks">民國年月</div></div>
  </div>
</div>

<div style="max-width:1560px;margin:0 auto">
  <div class="toolbar">
    <button class="vbtn active" id="btnList" onclick="setView('list')">卡片</button>
    <button class="vbtn" id="btnMap" onclick="setView('map')">地圖</button>
    <input class="search-inp" id="searchInput" placeholder="搜尋案名、建商、建材…">
    <select class="fil" id="tagFilter">
      <option value="all">全部定位</option>
      <option value="premium">溢價</option>
      <option value="normal">均值</option>
      <option value="discount">折價</option>
    </select>
    <select class="fil" id="statusFilter">
      <option value="all">全部狀態</option>
      <option value="預售">預售屋</option>
      <option value="新成屋">新成屋</option>
      <option value="成屋">成屋</option>
    </select>
    <select class="fil" id="sortSelect">
      <option value="price_desc">單價 ↓</option>
      <option value="price_asc">單價 ↑</option>
      <option value="sold_desc">售出率 ↓</option>
      <option value="count_desc">成交量 ↓</option>
    </select>
    <span class="tbl-ct" id="tblCt"></span>
    
  </div>
</div>

<div class="main">
  <!-- MAP -->
  <div id="mapView">
    <div class="map-head">
      <h2>地圖分布 · 案名＋均價</h2>
      <span class="mleg">■ 紅=溢價 ■ 黑=均值 ■ 綠=折價 ⬚ 虛線=預售</span>
    </div>
    <div id="theMap"></div>
  </div>

  <!-- CARDS -->
  <div id="listView"><!-- cards --></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <div class="modal-hd">
      <div>
        <div id="modalTag"></div>
        <h2 id="modalTitle"></h2>
        <div class="mdev" id="modalDev"></div>
      </div>
      <button onclick="closeModal()">×</button>
    </div>
    <div id="modalSold" class="modal-sold"></div>
    <div class="modal-bd" id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

// ── 售出率計算 ──
function getSold(p){
  if(!p.units || p.units===0) return null;
  const pct = Math.min(Math.round(p.count/p.units*100),100);
  return {pct, text:`實登 ${p.count} / ${p.units} 戶`};
}
function soldColor(tag){ return tag==='premium'?'red':tag==='discount'?'green':'amber'; }

// ── 甜甜圈 SVG ──
function donutSVG(p, size=44){
  const vals=[['1R',p.r1||0,'#A78BFA'],['2R',p.r2||0,'#3B82F6'],['3R',p.r3||0,'#22C55E'],['4R',p.r4||0,'#F97316']].filter(x=>x[1]>0);
  const cx=size/2,cy=size/2,R=size*0.34,sw=size*0.11,circ=2*Math.PI*R;
  let offset=0,arcs='';
  vals.forEach(([_,v,c])=>{
    const dash=circ*v/100;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-circ*offset/100}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=v;
  });
  const main=p.r3>p.r2?`${p.r3}%`:`${p.r2}%`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-family:var(--mono);font-size:${size*0.2}px;font-weight:700;fill:var(--text)">${main}</text></svg>`;
}

// ── CARD 渲染 ──
function renderCards(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  const tag=document.getElementById('tagFilter').value;
  const stat=document.getElementById('statusFilter').value;
  const sort=document.getElementById('sortSelect').value;

  let data=[...projects].map((p,i)=>({...p,idx:i,pct:(p.avgPrice-BASE)/BASE*100,sold:getSold(p)}));
  if(search) data=data.filter(p=>[p.name,p.dev,p.addr,...(p.kit||[]),...(p.bath||[]),...(p.other||[])].join(' ').toLowerCase().includes(search));
  if(tag!=='all') data=data.filter(p=>p.tag===tag);
  if(stat!=='all') data=data.filter(p=>p.status.includes(stat));

  if(sort==='price_desc') data.sort((a,b)=>b.avgPrice-a.avgPrice);
  else if(sort==='price_asc') data.sort((a,b)=>a.avgPrice-b.avgPrice);
  else if(sort==='sold_desc') data.sort((a,b)=>(b.sold?.pct||0)-(a.sold?.pct||0));
  else data.sort((a,b)=>b.count-a.count);

  document.getElementById('tblCt').textContent=`${data.length} / ${projects.length} 案`;

  const pct2cls=p=>{const pct=p.pct;return pct>=10?'red':pct<=-5?'green':'amber'};
  const tagLabel=t=>t==='premium'?'溢價':t==='discount'?'折價':'均值';
  const tagCls=t=>t==='premium'?'tb-red':t==='discount'?'tb-green':'tb-amber';
  const statusCls=s=>{if(s.includes('預售'))return 'sp-pre';if(s.includes('新成'))return 'sp-new';return 'sp-done'};

  const grid=document.getElementById('listView');
  grid.innerHTML=data.map(p=>{
    const barW=Math.min(Math.abs(p.pct)/25*100,100);
    const barCls=p.pct>=0?'vs-pos':'vs-neg';
    const prCls=pct2cls(p);
    const kits=(p.kit||[]).slice(0,2).map(k=>`<span class="chip k">${k.substring(0,20)}</span>`).join('');
    const baths=(p.bath||[]).slice(0,1).map(b=>`<span class="chip b">${b.substring(0,18)}</span>`).join('');
    const soldPct=p.sold?p.sold.pct:null;
    const soldBar=soldPct!==null?`<div class="cc-sold">
      <div class="sold-label">
        <span class="sold-l">售出率（實登/總戶）</span>
        <span class="sold-pct" style="color:var(--${soldColor(p.tag)})">${soldPct}%</span>
      </div>
      <div class="sold-bar"><div class="sold-fill ${soldColor(p.tag)}" style="width:${soldPct}%"></div></div>
      <div style="font-size:11px;color:var(--mute);margin-top:3px;font-family:var(--mono)">${p.sold.text}</div>
    </div>`:'';
    return `<div class="case-card ${p.tag}${p.warn?' warn':''}" onclick="openModal(${p.idx})">
      <div class="cc-head">
        <div class="cc-top">
          <div class="cc-name">${p.name}${p.warn?' ⚠':''}</div>
          <div class="cc-price ${prCls}">${p.avgPrice.toFixed(2)}<span style="font-size:13px;color:var(--dim);font-weight:400"> 萬</span></div>
        </div>
        <div class="cc-meta">
          <span class="cc-dev">${p.dev}</span>
          <span class="status-pill ${statusCls(p.status)}">${p.status}</span>
        </div>
      </div>
      ${soldBar}
      <div class="cc-chips">${kits}${baths}</div>
      <div class="cc-foot">
        <div class="vs-track"><div class="vs-center"></div><div class="vs-fill ${barCls}" style="width:${barW/2}%"></div></div>
        <span class="vs-pct ${p.pct>=0?'up':'dn'}">${(p.pct>=0?'+':'')+p.pct.toFixed(1)}%</span>
        <span class="tag-badge ${tagCls(p.tag)}">${tagLabel(p.tag)}</span>
      </div>
    </div>`;
  }).join('');
}

// ── MAP ──
let mapObj=null,mapMarkers=[];
function initMap(){
  if(mapObj) return;
  mapObj=L.map('theMap',{zoomControl:true,scrollWheelZoom:true}).setView([22.7280,120.2830],15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
  }).addTo(mapObj);
  projects.forEach((p,i)=>{
    const isPresale=p.status.includes('预售')||p.status.includes('預售');
    let cls=isPresale?'presale':(p.tag==='premium'?'premium':p.tag==='discount'?'discount':'normal');
    if(p.warn) cls='warn';
    const pct=(p.avgPrice-BASE)/BASE*100;
    const ic=L.divIcon({className:'',html:`<div class="mpill ${cls}"><span class="pn">${p.name}</span><span class="pp">${p.avgPrice.toFixed(2)} 萬</span></div>`,iconSize:[null,null],iconAnchor:[0,30]});
    const m=L.marker([p.lat,p.lng],{icon:ic}).addTo(mapObj);
    const priceColor=p.tag==='premium'?'var(--red)':p.tag==='discount'?'var(--green)':'var(--amber)';
    const sold=getSold(p);
    m.bindPopup(`<div class="mpopup">
      <div class="mpopup-tag" style="color:${priceColor}">${p.tag==='premium'?'▲ 溢價':p.tag==='discount'?'▼ 折價':'● 均值'} · ${p.status}</div>
      <h3>${p.name}</h3>
      <div class="mprice" style="color:${priceColor}">${p.avgPrice.toFixed(2)} 萬/坪</div>
      <div class="mdelta" style="color:${priceColor}">${(pct>=0?'+':'')+pct.toFixed(1)}% vs 基準</div>
      <div class="mrow"><span>建商</span><span>${p.dev}</span></div>
      <div class="mrow"><span>戶數</span><span>${p.units} 戶</span></div>
      ${sold?`<div class="mrow"><span>售出率</span><span style="color:${priceColor}">${sold.pct}%</span></div>`:''}
      <button class="dbtn" onclick="closePopups();openModal(${i})">查看完整詳情 →</button>
    </div>`,{maxWidth:230});
    mapMarkers.push(m);
  });
}
function closePopups(){if(mapObj)mapMarkers.forEach(m=>m.closePopup())}

function setView(v){
  document.getElementById('listView').style.display=v==='list'?'':'none';
  document.getElementById('mapView').style.display=v==='map'?'block':'none';
  document.getElementById('btnList').classList.toggle('active',v==='list');
  document.getElementById('btnMap').classList.toggle('active',v==='map');
  if(v==='map'){initMap();setTimeout(()=>mapObj.invalidateSize(),80)}
}

// ── MODAL ──
function openModal(i){
  const p=projects[i];
  const pct=(p.avgPrice-BASE)/BASE*100;
  const pctStr=(pct>=0?'+':'')+pct.toFixed(1)+'%';
  const priceColor=p.tag==='premium'?'var(--red)':p.tag==='discount'?'var(--green)':'var(--amber)';
  const tagCls=p.tag==='premium'?'tb-red':p.tag==='discount'?'tb-green':'tb-amber';
  const tagLabel=p.tag==='premium'?'PREMIUM 溢價':p.tag==='discount'?'DISCOUNT 折價':'NEUTRAL 均值';
  document.getElementById('modalTag').innerHTML=`<span class="tag-badge ${tagCls}" style="font-size:13px">${tagLabel} ${pctStr}</span>`;
  document.getElementById('modalTitle').textContent=p.name+(p.warn?' ⚠':'');
  document.getElementById('modalDev').textContent=`${p.dev} · ${p.status} · 交屋：${p.handover}`;
  const sold=getSold(p);
  document.getElementById('modalSold').innerHTML=sold?`<div class="ms-row">
    <span style="font-size:14px;color:var(--dim);min-width:100px">售出率（實登）</span>
    <div class="ms-bar"><div class="ms-fill ${soldColor(p.tag)}" style="width:${sold.pct}%;background:${priceColor}"></div></div>
    <span class="ms-pct" style="color:${priceColor}">${sold.pct}%</span>
  </div><div class="ms-detail">${sold.text} · 貸款成數 ${p.loan}</div>`:'';
  document.getElementById('modalBody').innerHTML=`
    <div class="price-hero">
      <span class="ph-num" style="color:${priceColor}">${p.avgPrice.toFixed(2)}</span>
      <span class="ph-unit">萬/坪</span>
      <span style="font-size:15px;font-family:var(--mono);color:var(--dim)">${p.minPrice} ~ ${p.maxPrice} · ${p.count} 筆成交</span>
    </div>
    <div class="msec-title">建案資訊</div>
    <div class="info-grid">
      <div class="info-cell"><div class="ic-label">地址</div><div class="ic-val">${p.addr}</div></div>
      <div class="info-cell"><div class="ic-label">樓層 / 戶數</div><div class="ic-val">${p.floor} / ${p.units} 戶</div></div>
      <div class="info-cell"><div class="ic-label">建造執照</div><div class="ic-val" style="font-size:13px">${p.permit||'—'}</div></div>
      <div class="info-cell full"><div class="ic-label">格局規劃</div><div class="ic-val">${p.layout}</div></div>
      <div class="info-cell"><div class="ic-label">房型比例</div><div class="ic-val" style="display:flex;align-items:center;gap:12px">${donutSVG(p,52)}
        <div style="font-size:13px;color:var(--dim);line-height:1.8">${p.r2?`2房 ${p.r2}%<br>`:''}${p.r3?`3房 ${p.r3}%<br>`:''}${p.r4?`4房 ${p.r4}%`:''}</div>
      </div></div>
      <div class="info-cell"><div class="ic-label">座標</div><div class="ic-val" style="font-family:var(--mono);font-size:13px">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div></div>
    </div>
    <div class="msec-title">廚衛建材</div>
    <div class="mat-list">
      ${(p.kit||[]).map(k=>`<span class="chip k">廚 ${k}</span>`).join('')}
      ${(p.bath||[]).map(b=>`<span class="chip b">衛 ${b}</span>`).join('')}
    </div>
    <div class="msec-title">特色配備</div>
    <div class="mat-list">${(p.other||[]).map(o=>`<span class="chip">${o}</span>`).join('')}</div>
    ${p.notes?`<div class="notes-box"><b style="color:var(--amber)">注意事項</b><br>${p.notes}</div>`:''}
    <div class="analysis-box"><span class="al">分析觀點</span>${p.analysis}</div>
    <div id="fp-inject"></div>
    <div class="link-row">
      ${p.s591?`<a class="link-btn" href="${p.s591}" target="_blank">591 詳情 ↗</a>`:''}
      <a class="link-btn" href="https://www.google.com/maps/?q=${p.lat},${p.lng}" target="_blank">Google Map ↗</a>
    </div>`;
  // 插入平面圖
  const fpDiv = document.getElementById('fp-inject');
  const fpImgs = FLOOR_PLANS[p.name];
  if(fpImgs && fpImgs.length > 0){
    let fpHtml = '<div class="msec-title">FLOOR PLANS · 平面圖</div>';
    fpHtml += '<div class="fp-count">共 ' + fpImgs.length + ' 張 · 點擊放大</div>';
    fpHtml += '<div class="fp-grid">';
    for(let fi=0; fi<fpImgs.length; fi++){
      fpHtml += '<img class="fp-thumb" src="' + fpImgs[fi] + '" loading="lazy" onclick="openLB(' + i + ',' + fi + ')" onerror="this.style.display=&apos;none&apos;">';
    }
    fpHtml += '</div>';
    fpDiv.innerHTML = fpHtml;
  } else {
    fpDiv.innerHTML = '';
  }
  document.getElementById('overlay').classList.add('open');
  if(mapObj) mapObj.setView([p.lat,p.lng],17,{animate:true});
}

// ── LIGHTBOX ──
let lbName = '', lbIdx = 0;
function openLB(projIdx, idx){
  lbName = projects[projIdx].name; lbIdx = idx;
  const imgs = FLOOR_PLANS[lbName];
  document.getElementById('lbImg').src = imgs[idx];
  document.getElementById('lbCounter').textContent = (idx+1) + ' / ' + imgs.length;
  document.getElementById('lbOverlay').classList.add('on');
}
function closeLB(){ document.getElementById('lbOverlay').classList.remove('on'); }
function lbNav(d){
  const imgs = FLOOR_PLANS[lbName];
  lbIdx = (lbIdx + d + imgs.length) % imgs.length;
  document.getElementById('lbImg').src = imgs[lbIdx];
  document.getElementById('lbCounter').textContent = (lbIdx+1) + ' / ' + imgs.length;
}
document.addEventListener('keydown', e=>{
  const lb = document.getElementById('lbOverlay');
  if(!lb.classList.contains('on')) return;
  if(e.key==='Escape') closeLB();
  if(e.key==='ArrowLeft') lbNav(-1);
  if(e.key==='ArrowRight') lbNav(1);
});

function closeModal(){document.getElementById('overlay').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// ── INIT ──
document.getElementById('searchInput').addEventListener('input',renderCards);
document.getElementById('tagFilter').addEventListener('change',renderCards);
document.getElementById('statusFilter').addEventListener('change',renderCards);
document.getElementById('sortSelect').addEventListener('change',renderCards);
setView('list');
renderCards();
</script>

<!-- LIGHTBOX -->
<div class="lb-overlay" id="lbOverlay">
  <button class="lb-close" onclick="closeLB()">×</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img class="lb-img" id="lbImg" src="" alt="平面圖">
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

</body>
</html>
